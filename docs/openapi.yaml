openapi: 3.0.3

info:
  title: API Jeux Vidéo
  version: 1.0.0
  description: API de gestion d'une collection de jeux vidéo.

servers:
  - url: http://localhost:3000

paths:
  /api/games:
    get:
      summary: Récupérer tous les jeux
      responses:
        '200':
          description: Liste des jeux récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Ajouter un jeu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '201':
          description: Jeu créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Données invalides ou JSON mal formé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant unique du jeu (entier strictement positif).
        schema:
          type: integer
          minimum: 1
    get:
      summary: Récupérer un jeu
      responses:
        '200':
          description: Jeu trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identifiant invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Modifier un jeu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '200':
          description: Jeu modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identifiant ou données invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Supprimer un jeu
      responses:
        '204':
          description: Jeu supprimé.
        '400':
          description: Identifiant invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Game:
      type: object
      required:
        - id
        - title
        - editor
        - releaseYear
        - genre
        - rating
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "The Legend of Zelda: Breath of the Wild"
        editor:
          type: string
          example: Nintendo
        releaseYear:
          type: integer
          minimum: 1950
          maximum: 2100
          example: 2017
        genre:
          type: string
          example: Action-aventure
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 10
          example: 9.7
    CreateGameInput:
      type: object
      required:
        - title
        - editor
        - releaseYear
        - genre
        - rating
      properties:
        title:
          type: string
          minLength: 1
          example: Elden Ring
        editor:
          type: string
          minLength: 1
          example: Bandai Namco
        releaseYear:
          type: integer
          minimum: 1950
          maximum: 2100
          example: 2022
        genre:
          type: string
          minLength: 1
          example: Action-RPG
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 10
          example: 9.5
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Données invalides
        details:
          type: array
          items:
            type: string
          example:
            - Le titre est obligatoire
            - La note doit être comprise entre 0 et 10
